name: release-checks

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install payment adapter dependencies
        run: python -m pip install -r paypal_adapter/requirements.lock

      - name: Prepare verified pmix release and fixtures
        if: matrix.os == 'ubuntu-latest'
        run: |
          (cd vendor/ubuntu-noble && sha256sum -c SHA256SUMS)
          sudo dpkg --install vendor/ubuntu-noble/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb
          dpkg-query -W util-linux
          test "$(id -u)" -ne 0
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            sudo apparmor_parser --replace .github/apparmor/pmix-bwrap
          fi
          python -B scripts/install_pmix.py vendor/pmix/PAYPAL_CAD_001_RELEASE_20261110.zip
          command -v prlimit
          command -v bwrap

      - name: Verify actual pmix sandbox execution
        if: matrix.os == 'ubuntu-latest'
        run: |
          PYTHONPATH=tests python -B -m unittest -v test_pmix_integration.PmixIntegration.test_successful_extraction_and_bom_reconciliation

      - name: Reproduce original experiment and prototype
        if: matrix.os == 'ubuntu-latest'
        working-directory: external/cad-experiment
        run: |
          python3 run_benchmark.py | tee benchmark-ci.log
          python3 cad_adapter_prototype.py | tee adapter-ci.log

      - name: Rebuild dossiers from raw evidence and audit
        run: python -B scripts/build_and_serve.py --evidence demo_evidence --no-serve

      - name: All LEGION tests including real Linux pmix integration
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -v |& tee "${RUNNER_TEMP}/legion-tests.log"
          # zero skips is a hard invariant (real-input CAD/ZTL tests live in tests/judge_real_cad027.py, run by judge-e2e)
          ! grep -E "\.\.\. skipped|skipped=" "${RUNNER_TEMP}/legion-tests.log"

      - name: Verify all 860 critical records against source STEP files
        if: matrix.os == 'ubuntu-latest'
        run: PYTHONPATH=. python -B scripts/audit_pmix_provenance.py | tee "${RUNNER_TEMP}/pmix-provenance.json"

      - name: Windows LEGION tests (supported release, industrial and demand modules)
        if: matrix.os == 'windows-latest'
        run: PYTHONPATH=tests python -B -m unittest -v test_demand_first test_industrial test_release |& tee "${RUNNER_TEMP}/legion-tests.log"

      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: '22'

      - name: Real browser workflow at 1440px and 390px
        if: matrix.os == 'ubuntu-latest'
        env:
          LEGION_CAD_EVIDENCE: ${{ runner.temp }}/cad-browser
        run: |
          npm ci --prefix scripts/pmix-browser --ignore-scripts
          scripts/pmix-browser/node_modules/.bin/playwright install chromium
          node scripts/test_pmix_browser.cjs

      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: cad-browser-and-regressions
          path: |
            ${{ runner.temp }}/cad-browser/
            ${{ runner.temp }}/legion-tests.log
            ${{ runner.temp }}/pmix-provenance.json
            external/cad-experiment/benchmark-ci.log
            external/cad-experiment/adapter-ci.log
            external/cad-experiment/BENCHMARK_RESULTS.json
            external/cad-experiment/ADAPTER_RESULTS.json

      - name: Payment adapter tests (fake provider, no network; Windows-only adapter)
        if: matrix.os == 'windows-latest'
        working-directory: paypal_adapter
        run: python -B -m unittest discover -s tests -t . -v

      - name: Payment negative controls (N07, N09, N10, N14; Windows-only adapter)
        if: matrix.os == 'windows-latest'
        run: python -B scripts/run_payment_negatives.py "${RUNNER_TEMP}/payment_negatives.json"

      - name: Raw evidence unchanged by the build
        run: git diff --exit-code -- demo_evidence/runs demo_evidence/paypal_runs demo_evidence/negatives

      - name: Payment adapter matches the recorded payment runtime
        run: |
          python - <<'EOF'
          import hashlib, json, pathlib
          rec = json.loads(pathlib.Path("docs/PAYMENT_RUNTIME.json").read_text())
          pub = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(pathlib.Path("paypal_adapter/commerce_adapter").glob("*.py"))}
          ref = {k.split("/", 1)[1]: v for k, v in rec["files_sha256_at_0bb385f"].items() if k.startswith("commerce_adapter/")}
          assert pub == ref, (pub, ref)
          print("commerce_adapter byte-identical to LEGION-Commerce 0bb385f")
          EOF

      - name: Server smoke test (all five payments displayed, no cross-contract payment)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -B -m deal_rescue.server --evidence demo_evidence --port 8795 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8795/api/runs >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8795/ | grep -q "LEGION Deal Rescue"
          curl -sf "http://127.0.0.1:8795/api/dossier?run=run-2" > r2.json
          curl -sf "http://127.0.0.1:8795/api/dossier?run=run-1" > r1.json
          curl -sf -o /dev/null "http://127.0.0.1:8795/api/download?kind=passport&run=run-2"
          python - <<'EOF'
          import json
          r2, r1 = json.load(open("r2.json")), json.load(open("r1.json"))
          p = r2["paypal"]
          assert p["readback_confirmed_captures"] == 5 and p["provider_confirmed_cents"] == 49500, p["badge"]
          assert len({s["capture_id"] for s in p["slots"]}) == 5
          assert r1["paypal"]["provider_confirmed_cents"] == 0
          print("server OK:", p["badge"])
          EOF

      - name: No secrets, private identifiers or machine paths
        run: |
          result=0
          grep -rIlE 'nvapi-[A-Za-z0-9]{8}|client_secret["'"'"' ]*[:=] *["'"'"'][A-Za-z0-9]|BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|RGFNDXFWF988G|Users[\/]+Administrator|ADMINI~1|Dropbox' \
            --exclude-dir=.git --exclude-dir=.github . || result=$?
          test "$result" -eq 1

  judge-e2e:
    # The exact command a judge runs on a clean clone: real STEP from Seeed, OpenCascade XCAF, BOM, real ZTL stand,
    # commerce replay, PayPal evidence check, full test suite with 0 required skips, headless browser E2E.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pmix sandbox prerequisites (same pinned packages as the checks job)
        run: |
          (cd vendor/ubuntu-noble && sha256sum -c SHA256SUMS)
          sudo dpkg --install vendor/ubuntu-noble/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            sudo apparmor_parser --replace .github/apparmor/pmix-bwrap
          fi
          python -B scripts/install_pmix.py vendor/pmix/PAYPAL_CAD_001_RELEASE_20261110.zip

      - name: Judge Mode (python -m scripts.judge_demo --ci)
        run: python -m scripts.judge_demo --ci

      - name: Verdict invariants (JUDGE_GO=T, 0 required skips, 10/10 negatives, browser E2E)
        if: always()
        run: |
          python - <<'EOF'
          import json
          g = json.load(open("judge_out/JUDGE_GO_NO_GO.json"))
          print(json.dumps({k: g.get(k) for k in ("final", "gates", "skipped_required", "negative_tests", "browser_e2e")}, indent=1))
          assert g["skipped_required"] == 0, "required tests were skipped"
          assert g["negative_tests"] == "10/10", g["negative_tests"]
          assert g["gates"]["browser_e2e"] == "T", g.get("browser_e2e")
          assert g["final"] == "T", g["gates"]
          assert g["engineering_admission"] == "Z" and g["ztl_verdict"]["production"] == "OPEN"
          EOF

      - name: Publish the verdict and log tail as annotations (readable without signing in)
        if: always()
        run: |
          python - <<'EOF'
          import json, pathlib
          o = pathlib.Path("judge_out")
          g = o / "JUDGE_GO_NO_GO.json"
          if g.is_file():
              d = json.loads(g.read_text())
              print("::notice title=JUDGE_GO_NO_GO::" + json.dumps({k: d.get(k) for k in ("final", "gates", "skipped_required", "negative_tests", "error", "unsupported")}))
              print("::notice title=tests::" + json.dumps(d.get("tests")))
          for name in ("CLEAN_CLONE_LOG.txt", "TESTS_FULL_SUITE.log", "TESTS_REQUIRED_REAL.log", "SERVER.log"):
              p = o / name
              if p.is_file():
                  tail = p.read_text(errors="replace")[-1500:].replace("%", "%25").replace(chr(13), "").replace(chr(10), "%0A")
                  print(f"::notice title={name} tail::{tail}")
          b = o / "BROWSER_E2E_RESULT.json"
          if b.is_file():
              d = json.loads(b.read_text())
              bad = [c for c in d["checks"] if not c["pass"]][:8]
              print("::notice title=browser e2e::" + json.dumps({"verdict": d["verdict"], "failed": bad, "viewports": d["viewports"]})[:3000])
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-e2e
          path: |
            judge_out/
            !judge_out/**/*.step
